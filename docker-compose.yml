services:

  # ============================================================
  # EXISTING APPLICATION SERVICES
  # ============================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ticketing-postgres

    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: postgres

    ports:
      - "5434:5432"

    volumes:
      - ./storage/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: ticketing-redis

    command: >-
      redis-server
      --requirepass "${REDIS_PASSWORD:-DhvaniRedis2026Secure}"
      --bind 0.0.0.0
      --protected-mode yes

    ports:
      - "6379:6379"

    volumes:
      - ./storage/redis:/data


  frontend:
    build:
      context: ./frontend

    container_name: frontend

    ports:
      - "8080:80"


  ragchatbotservice:
    build:
      context: ./ragchatbotservice

    container_name: ragchatbotservice

    env_file:
      - ./ragchatbotservice/.env

    ports:
      - "4321:4321"

    volumes:
      - ./storage/ragchatbotservice/logs:/app/logs
      - ./storage/ragchatbotservice/data:/app/data

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

    restart: unless-stopped


  # ============================================================
  # LANGFUSE
  # ============================================================

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    container_name: langfuse-web
    restart: always

    depends_on:
      langfuse-postgres:
        condition: service_healthy

      langfuse-minio:
        condition: service_healthy

      langfuse-redis:
        condition: service_healthy

      langfuse-clickhouse:
        condition: service_healthy

    ports:
      - "3000:3000"

    environment:
      NEXTAUTH_URL: http://localhost:3000

      DATABASE_URL: postgresql://langfuse:langfusepass@langfuse-postgres:5432/langfuse

      SALT: ${LANGFUSE_SALT}

      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}

      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}

      TELEMETRY_ENABLED: "false"

      # ClickHouse
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhousepass
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      # Redis
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: langfuseredispass

      # MinIO / S3
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

      LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
      LANGFUSE_S3_BATCH_EXPORT_REGION: auto
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: minio
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"

      # Optional
      LANGFUSE_INIT_ORG_NAME: RAG Chatbot
      LANGFUSE_INIT_PROJECT_NAME: RAG Chatbot POC


  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    container_name: langfuse-worker
    restart: always

    depends_on:
      langfuse-postgres:
        condition: service_healthy

      langfuse-minio:
        condition: service_healthy

      langfuse-redis:
        condition: service_healthy

      langfuse-clickhouse:
        condition: service_healthy

    environment:
      NEXTAUTH_URL: http://langfuse-web:3000

      DATABASE_URL: postgresql://langfuse:langfusepass@langfuse-postgres:5432/langfuse

      SALT: ${LANGFUSE_SALT}

      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}

      TELEMETRY_ENABLED: "false"

      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhousepass
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: langfuseredispass

      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"


  # ============================================================
  # LANGFUSE POSTGRES
  # ============================================================

  langfuse-postgres:
    image: postgres:17
    container_name: langfuse-postgres
    restart: always

    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfusepass
      POSTGRES_DB: langfuse

    ports:
      - "127.0.0.1:5435:5432"

    volumes:
      - ./storage/langfuse/postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U langfuse -d langfuse"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ============================================================
  # LANGFUSE REDIS
  # ============================================================

  langfuse-redis:
    image: redis:7
    container_name: langfuse-redis
    restart: always

    command:
      - redis-server
      - --requirepass
      - langfuseredispass
      - --maxmemory-policy
      - noeviction

    ports:
      - "127.0.0.1:6380:6379"

    volumes:
      - ./storage/langfuse/redis:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "langfuseredispass", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10


  # ============================================================
  # LANGFUSE CLICKHOUSE
  # ============================================================

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: langfuse-clickhouse
    restart: always

    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhousepass

    ports:
      - "127.0.0.1:8124:8123"
      - "127.0.0.1:9001:9000"

    volumes:
      - ./storage/langfuse/clickhouse:/var/lib/clickhouse
      - ./storage/langfuse/clickhouse-logs:/var/log/clickhouse-server

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  # ============================================================
  # LANGFUSE MINIO
  # ============================================================

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    container_name: langfuse-minio
    restart: always

    entrypoint: sh

    command:
      - -c
      - mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data

    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret

    ports:
      - "9090:9000"
      - "127.0.0.1:9091:9001"

    volumes:
      - langfuse-minio-data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s


# ================================================================
# NETWORK
# ================================================================

networks:
  default:
    name: rag-network

volumes:
  langfuse-minio-data: